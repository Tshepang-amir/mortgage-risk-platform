# Local development services. PROJECT.md section 8.
#
# Phase 0 defines the MLflow tracking stack only. The Airflow services
# (webserver, scheduler, and the DAG volume mounts for dags/) are added in
# Phase 10 alongside the ingestion and backfill DAGs.

name: mortgage-risk-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: mrp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow}
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    container_name: mrp-mlflow
    depends_on:
      postgres:
        condition: service_healthy
    # The published MLflow image ships no Postgres driver, so install it before
    # the server starts. Section 8 specifies a Postgres-backed tracking store.
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow}@postgres:5432/${POSTGRES_DB:-mlflow}
      --artifacts-destination /mlartifacts"
    # Host port is not 5000: on this machine ProjectWise Drive holds ::1:5000,
    # and Windows resolves localhost to IPv6 first, so 5000 would reach it
    # instead of MLflow. Override with MLFLOW_PORT if 5555 is taken.
    ports:
      - "${MLFLOW_PORT:-5555}:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts

volumes:
  postgres-data:
  mlflow-artifacts:
